name: Deploy Supabase migrations

# Gates prod deploys behind a successful schema push. Only runs when a
# commit to main touches supabase/migrations/**, so non-migration commits
# are unaffected and continue to deploy via the existing path unchanged.
on:
  push:
    branches:
      - main
    paths:
      - "supabase/migrations/**"

jobs:
  migrate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase link --project-ref rcrjfweguedbtfngeovp

      - name: Push migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase db push

      # Only reached if the previous step succeeded. On failure, the job
      # stops here and the deploy hook below is never called — app code
      # must never ship ahead of its schema.
      - name: Trigger Vercel deploy
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: curl -X POST -sf "$VERCEL_DEPLOY_HOOK_URL"
